name: Prepare third-class source materials
on:
  push:
    branches: ['denken-daily-dual']
    paths: ['apps/denken-study/scripts/daily_collect.py', '.github/workflows/denken-third-probe.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install PyMuPDF==1.26.6
      - run: python3 apps/denken-study/scripts/daily_collect.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/denken-study/assets apps/denken-study/data
          git commit -m 'Retrieve official third-class source papers'
          git push
