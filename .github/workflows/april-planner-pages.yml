name: Publish apps and daily Denken update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/denken-study/**'
      - 'apps/april-planner/**'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - run: python3 -m pip install PyMuPDF==1.26.6
      - run: python3 apps/denken-study/scripts/daily_collect.py
      - run: python3 apps/denken-study/tests/archive_test.py
      - run: python3 apps/denken-study/tests/dual_test.py
      - run: python3 apps/denken-study/scripts/build_app.py
      - name: Save only verified public study materials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/denken-study/assets/official apps/denken-study/assets/third apps/denken-study/data/official-archive/archive.json apps/denken-study/data/third/archive.json apps/denken-study/data/daily-status.json apps/denken-study/index.html apps/denken-study/third.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add the daily bounded official study batch'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  build:
    needs: collect
    if: always() && github.ref == 'refs/heads/main' && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build empty-data planner, savings, weight and learning apps
        run: |
          node --check apps/april-planner/core.js
          node --check apps/april-planner/app.js
          node apps/april-planner/tests/core.cjs
          node apps/april-planner/tests/carryover.cjs
          python3 apps/april-planner/build.py
          python3 apps/savings-ledger/build.py
          python3 apps/weight-buddy/build.py
          python3 apps/momo-day/build.py
          node --check apps/denken-study/core.js
          node --check apps/denken-study/comic.js
          node --check apps/denken-study/pwa-update.js
          node --check apps/denken-study/app.js
          node apps/denken-study/tests/core.cjs
          python3 apps/denken-study/tests/lessons_test.py
          python3 -m pip install PyMuPDF==1.26.6
          python3 apps/denken-study/tests/archive_test.py
          python3 apps/denken-study/tests/dual_test.py
          python3 apps/denken-study/scripts/build_app.py
          python3 apps/denken-study/scripts/build_ipad_site.py
          python3 -m zipfile -e apps/april-planner/offline-site.zip "$RUNNER_TEMP/april-planner-site"
          python3 -m zipfile -e apps/savings-ledger/offline-site.zip "$RUNNER_TEMP/april-planner-site/savings"
          python3 -m zipfile -e apps/weight-buddy/offline-site.zip "$RUNNER_TEMP/april-planner-site/weight"
          python3 -m zipfile -e apps/momo-day/offline-site.zip "$RUNNER_TEMP/april-planner-site/momo"
          python3 -m zipfile -e apps/denken-study/ipad-site.zip "$RUNNER_TEMP/april-planner-site/denken"
          python3 - <<'PY'
          from pathlib import Path
          import json
          source = Path('apps/april-planner/initial-data.js').read_text()
          data = json.loads(source.removeprefix('window.PLANNER_INITIAL=').strip().removesuffix(';'))
          assert data['records'] == {} and data['importedDays'] == 0
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/april-planner-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the planner shell
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
