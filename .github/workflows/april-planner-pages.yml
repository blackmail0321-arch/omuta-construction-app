name: Publish April planner (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build empty-data planner and savings app
        run: |
          python3 apps/april-planner/build.py
          python3 apps/savings-ledger/build.py
          python3 -m zipfile -e apps/april-planner/offline-site.zip "$RUNNER_TEMP/april-planner-site"
          python3 -m zipfile -e apps/savings-ledger/offline-site.zip "$RUNNER_TEMP/april-planner-site/savings"
          python3 - <<'PY'
          from pathlib import Path
          import json
          source = Path('apps/april-planner/initial-data.js').read_text()
          data = json.loads(source.removeprefix('window.PLANNER_INITIAL=').strip().removesuffix(';'))
          assert data['records'] == {} and data['importedDays'] == 0
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/april-planner-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the planner shell
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
