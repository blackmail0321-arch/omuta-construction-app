name: Collect official Denken archive
on:
  push:
    branches: ['denken-official-archive-*']
    paths:
      - '.github/workflows/denken-official-archive.yml'
      - 'apps/denken-study/scripts/collect_archive.py'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install PyMuPDF==1.26.6
      - run: python3 apps/denken-study/scripts/collect_archive.py
      - name: Save retrieved source inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/denken-study/data/official-archive apps/denken-study/assets/official
          if ! git diff --cached --quiet; then
            git commit -m 'Record official archive retrieval results'
            git push
          fi
