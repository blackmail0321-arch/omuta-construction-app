<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工事手順チェック表</title><style>body{font-family:system-ui,"Noto Sans JP",sans-serif;color:#17324e;margin:auto;max-width:980px;padding:24px;line-height:1.8}h1{line-height:1.4}h2{border-bottom:2px solid #2463a4;padding-top:20px}p{overflow-wrap:anywhere}a{color:#1252a1}button,input,select,textarea{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}button{cursor:pointer}img{max-width:100%}@media print{.toolbar{display:none}body{padding:0;font-size:10pt}h2{break-after:avoid}p{orphans:3;widows:3}} .row{border:1px solid #ccd9e6;border-radius:10px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block}input,select,textarea{width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:10px;position:sticky;top:0;background:#fff;padding:12px 0}textarea{min-height:70px}.status{color:#164d80}@media(max-width:600px){.grid{grid-template-columns:1fr}}@media print{.row{break-inside:avoid}.toolbar{display:none}textarea{height:90px}}</style><h1>工事手順チェック表</h1><p>補助記録／工事アプリ・共有DBとは接続しません。判定基準は契約図書・提出要領で確認。手順の詳細は別冊をご参照ください。</p><div class="grid"><label>工事名<input id="project"></label><label>担当者<input id="person"></label></div><div class="toolbar"><button id="save">JSONを保存</button><label>JSONから読込<input id="restore" type="file" accept=".json"></label><button id="print">印刷・PDF保存</button><a href="/volume1.html">目次</a></div><p id="notice" role="status"></p><p id="count"></p><main id="rows"></main><script>
const ITEMS=[{"id": "A01", "text": "契約図書・図面・仕様書・質問回答・提出要領を一覧化し、版と適用年度を固定した。", "phase": "A. 契約前後・工事立上げ"}, {"id": "A02", "text": "工事場所・範囲・金額・消費税・工期・着手日・完成予定日を契約書で確認した。", "phase": "A. 契約前後・工事立上げ"}, {"id": "A03", "text": "監督担当・現場代理人・主任／監理技術者等の体制と連絡先、緊急連絡網を確認した。", "phase": "A. 契約前後・工事立上げ"}, {"id": "A04", "text": "必要な届出、資格、保険、保証、建退共等の対象・提出期日・部数を確認した。", "phase": "A. 契約前後・工事立上げ"}, {"id": "A05", "text": "図面・内訳・現況の不一致、除外範囲、支給品、既設設備の責任分界を記録した。", "phase": "A. 契約前後・工事立上げ"}, {"id": "A06", "text": "工事別保存先、命名規則、閲覧権限、バックアップ担当を決めた。", "phase": "A. 契約前後・工事立上げ"}, {"id": "B01", "text": "既設設備、配線配管、埋設物、他工種、利用者動線、搬入・仮設条件を調査した。", "phase": "B. 現地調査・施工計画"}, {"id": "B02", "text": "停電・断水・停止作業の必要性、範囲、日時、周知、復旧確認、緊急時対応を協議した。", "phase": "B. 現地調査・施工計画"}, {"id": "B03", "text": "作業手順、危険源、必要な資格・保護具・立会い、作業許可を安全計画へ反映した。", "phase": "B. 現地調査・施工計画"}, {"id": "B04", "text": "石綿等の事前調査の要否と必要な調査・届出・有資格者の関与を確認した。", "phase": "B. 現地調査・施工計画"}, {"id": "B05", "text": "工程表に調達、承諾、検査、停止作業、関係者協議、検査前是正を組み込んだ。", "phase": "B. 現地調査・施工計画"}, {"id": "B06", "text": "撮影計画を作り、着手前・施工中・隠蔽前・完成・試験・黒板内容と保管方法を決めた。", "phase": "B. 現地調査・施工計画"}, {"id": "B07", "text": "施工計画書の提出・照会・訂正・承認／確認条件を記録した。", "phase": "B. 現地調査・施工計画"}, {"id": "C01", "text": "図面の記号・名称・定格・寸法・数量・施工条件を照合した。器具記号だけで製品を特定していない。", "phase": "C. 材料・機器の照合と調達"}, {"id": "C02", "text": "承諾図・仕様書・性能資料・比較表と設計要求を照合した。", "phase": "C. 材料・機器の照合と調達"}, {"id": "C03", "text": "電気設備は該当範囲の電源・保護・接地・防水防塵・取付・制御等を有資格者が確認した。", "phase": "C. 材料・機器の照合と調達"}, {"id": "C04", "text": "同等品・代替品・仕様差異は根拠と協議記録を残し、必要な承認前に確定調達していない。", "phase": "C. 材料・機器の照合と調達"}, {"id": "C05", "text": "搬入時に名称・型番・数量・損傷・証明資料・保管条件を確認した。", "phase": "C. 材料・機器の照合と調達"}, {"id": "C06", "text": "単価資料の年度・地域・価格種別・見積条件・根拠ページと採用理由を記録した。", "phase": "C. 材料・機器の照合と調達"}, {"id": "C07", "text": "過去工事の数量・価格は参考扱いとし、今回条件で再確認した。", "phase": "C. 材料・機器の照合と調達"}, {"id": "D01", "text": "当日の作業範囲、危険、立入規制、責任者、連絡方法を確認した。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "D02", "text": "停止・遮断・無電圧等の確認は所定手順と有資格者で行い、誤復旧を防止した。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "D03", "text": "取付位置、支持、接続、配線配管、識別、貫通処理等を適用図書により確認した。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "D04", "text": "隠蔽部は隠れる前に写真・寸法・施工状況・必要な立会いの証跡を残した。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "D05", "text": "工程表・打合せ記録・月報・安全関係資料を取り決めた頻度で更新した。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "D06", "text": "現況差異・追加撤去・数量変更・不具合は日時・場所・写真・指示番号とともに記録した。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "D07", "text": "工事写真を工種・場所・工程へ分類し、原本と説明情報を対応付けた。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "D08", "text": "廃棄物の分類・保管・搬出・処理先・必要な伝票等を確認した。", "phase": "D. 施工中の工程・品質・安全管理"}, {"id": "E01", "text": "設計変更／数量変更／施工上の措置を区分し、変更理由・対象・根拠・金額・工期影響を整理した。", "phase": "E. 変更・不適合・追加工事"}, {"id": "E02", "text": "作業前に必要な指示・協議・承認を受けた。緊急措置は事後記録と所定手続を残した。", "phase": "E. 変更・不適合・追加工事"}, {"id": "E03", "text": "不適合は原因、影響範囲、是正方法、再検査、完了証拠まで管理した。", "phase": "E. 変更・不適合・追加工事"}, {"id": "E04", "text": "変更前データ・図面・金額を保全し、新旧差分と版を残した。", "phase": "E. 変更・不適合・追加工事"}, {"id": "E05", "text": "工期・数量・共通費・契約条件への影響を関係者が確認した。", "phase": "E. 変更・不適合・追加工事"}, {"id": "F01", "text": "試験計画、適用基準、判定値、測定器・校正状況、実施者、立会いを確認した。", "phase": "F. 試験・検査・完成準備"}, {"id": "F02", "text": "電気設備は適用範囲の絶縁・接地・導通・機能・点灯等の試験と結果を記録した。数値基準は適用図書で確認する。", "phase": "F. 試験・検査・完成準備"}, {"id": "F03", "text": "機械設備は適用範囲の圧力・漏れ・流量・機能等の試験と結果を記録した。対象外は理由を残す。", "phase": "F. 試験・検査・完成準備"}, {"id": "F04", "text": "不合格・手直し事項を是正し、再試験結果・閉鎖確認を残した。", "phase": "F. 試験・検査・完成準備"}, {"id": "F05", "text": "竣工図、機器表、取扱説明書、保証、試験記録、完成写真を実際の施工内容と一致させた。", "phase": "F. 試験・検査・完成準備"}, {"id": "F06", "text": "完成検査前に提出物・現場清掃・残置物・復旧・鍵・設定値等を確認した。", "phase": "F. 試験・検査・完成準備"}, {"id": "F07", "text": "検査指摘を一覧化し、担当・期限・是正証拠・確認者まで記録した。", "phase": "F. 試験・検査・完成準備"}, {"id": "G01", "text": "取扱説明、引渡物、保守連絡先、保証開始・終了、点検の引継ぎを記録した。", "phase": "G. 引渡し・精算・保存"}, {"id": "G02", "text": "実完成日・引渡日・検査日・関連書類の日付の整合を確認した。", "phase": "G. 引渡し・精算・保存"}, {"id": "G03", "text": "変更契約・出来高・数量・請求・精算関係を契約と照合した。", "phase": "G. 引渡し・精算・保存"}, {"id": "G04", "text": "最終図書・写真・試験・協議・履歴を発注者要領に従って整理し、提出・受領を記録した。", "phase": "G. 引渡し・精算・保存"}, {"id": "G05", "text": "JSONと添付ZIPを別々に保存し、復元確認・保管先・保存期限・担当を記録した。", "phase": "G. 引渡し・精算・保存"}, {"id": "G06", "text": "不要な利用者の権限・外部共有を解除し、保存義務と個人情報の取扱いを確認した。", "phase": "G. 引渡し・精算・保存"}];const KEY='omuta-procedure-checklist-v1';let data={kind:KEY,project:'',person:'',rows:{}};const el=id=>document.getElementById(id);let storage=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed.kind!==KEY||!parsed.rows)throw Error();data=parsed;}}catch{storage=false;el('notice').textContent='端末内保存を利用できないか、既存保存を読み込めません。自動上書きを停止しました。JSON保存を使ってください。';}
function text(tag,value,parent){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e;}
function persist(){if(storage)try{localStorage.setItem(KEY,JSON.stringify(data));el('notice').textContent='このブラウザ内に保存しました。別端末へはJSON保存で移してください。';}catch{storage=false;el('notice').textContent='端末内保存に失敗。画面は閉じずJSON保存してください。';}counts();}
function counts(){let done=0,na=0;ITEMS.forEach(i=>{if(data.rows[i.id]?.state==='完了')done++;if(data.rows[i.id]?.state==='対象外')na++;});el('count').textContent=ITEMS.length+'項目／完了 '+done+'／対象外 '+na+'／その他 '+(ITEMS.length-done-na);}
function render(){el('project').value=data.project||'';el('person').value=data.person||'';el('rows').replaceChildren();let phase='';for(const item of ITEMS){if(item.phase!==phase){text('h2',item.phase,el('rows'));phase=item.phase;}const r=data.rows[item.id]||{},s=document.createElement('section');s.className='row';text('h3',item.id+' '+item.text,s);const grid=document.createElement('div');grid.className='grid';for(const [key,name,type] of [['state','状態','select'],['owner','担当者','text'],['due','予定日','date'],['checked','確認日','date'],['evidence','根拠資料・確認者','text'],['note','備考・対象外理由','textarea']]){const l=document.createElement('label');l.textContent=name;const e=document.createElement(type==='select'?'select':type==='textarea'?'textarea':'input');if(e.tagName==='INPUT')e.type=type;if(type==='select')for(const v of ['未着手','作業中','要確認','完了','対象外']){const o=document.createElement('option');o.value=v;o.textContent=v;e.append(o);}e.value=r[key]||(key==='state'?'未着手':'');e.oninput=()=>{data.rows[item.id]||={};data.rows[item.id][key]=e.value;persist();};l.append(e);grid.append(l);}s.append(grid);el('rows').append(s);}counts();}
for(const key of ['project','person'])el(key).oninput=()=>{data[key]=el(key).value;persist();};el('print').onclick=()=>print();el('save').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='工事手順チェック_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);};
el('restore').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5000000)throw Error('ファイルが大きすぎます');const d=JSON.parse(await f.text());if(d.kind!==KEY||typeof d.project!=='string'||typeof d.person!=='string'||!d.rows||typeof d.rows!=='object'||Array.isArray(d.rows))throw Error('このチェック表のJSONではありません');const clean={kind:KEY,project:d.project,person:d.person,rows:{}};for(const i of ITEMS){const r=d.rows[i.id];if(!r)continue;clean.rows[i.id]={};for(const k of ['state','owner','due','checked','evidence','note'])if(typeof r[k]==='string')clean.rows[i.id][k]=r[k];}if(!confirm('表示中のチェック内容を読み込んだJSONへ置き換えます。必要なら先にJSON保存してください。'))return;data=clean;render();persist();}catch(error){el('notice').textContent='読み込めません：'+error.message;}finally{e.target.value='';}};render();
</script></html>
