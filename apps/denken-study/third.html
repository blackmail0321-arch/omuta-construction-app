ww.shiken.or.jp/chief/third/qa/index.html","localFile":"assets/third/2025-upper-law.pdf","bytes":1534971,"sha256":"51aeb8f1cbfe8e6d3667c2848a3d9fccff40a967f48aafc292fa13a13a6efbb0","pages":18,"verified":true},{"url":"https://www.shiken.or.jp/chief/upload/20250831_ch_third_a01.pdf","label":"令和7年度第三種電気主任技術者上期試験","year":2025,"stage":"primary","term":"upper","subject":null,"kind":"answer","foundOn":"https://www.shiken.or.jp/chief/third/qa/index.html","localFile":"assets/third/2025-upper-answers.pdf","bytes":52173,"sha256":"76fd3715ed487d19a56b387fb402de20ee09474e9fa55b0413f9037b96af06c9","pages":1,"verified":true}],"gradingReport":[{"year":2026,"status":"演習・採点対応","groups":66,"items":80},{"year":2025,"status":"演習・採点対応","groups":132,"items":160}],"officialIndex":"https://www.shiken.or.jp/chief/third/qa/","checkedAt":"2026-11-13T06:45:44.725235+09:00","reusePolicy":{"url":"https://www.shiken.or.jp/chief/third/qa/","purpose":"教育目的の利用・出典明記。原本を改変せず保管。"},"releaseYears":[2025,2026],"note":"原本PDFは必要なときだけ開きます。詳しい個別解説は未整備です。","downloadableYears":[2026,2025]},"papers":[{"id":"2026-upper","year":2026,"term":"upper","label":"2026年度 上期"},{"id":"2025-upper","year":2025,"term":"upper","label":"2025年度 上期"},{"id":"2025-lower","year":2025,"term":"lower","label":"2025年度 下期"}],"lessons":{"third-2026-upper-theory-1":{"scope":"コンデンサを7コマの図で理解","origin":"公式の令和8年度上期・第三種理論の問題と正答を照合した独自の図解です。ネット記事からの引用ではありません。図は理解用の模式図です。","panels":[{"title":"まず「変わらないもの」を見つける","ask":"コンデンサを広げたら、何から考えますか？","tell":["この問題では、充電した後に電源から外しています。電荷を保持する条件なので、電荷Qが変わりません。","初めは8µF・1000V。電極間距離だけを2倍にします。","Qはためた電気の量、Vは電圧、Cは静電容量を表す記号です。"],"visual":"capacitor-before"},{"title":"コンデンサは、向かい合う2枚の板","ask":"板を離すと、ためやすさはどうなりますか？","tell":["静電容量Cは、電荷のためやすさを表します。平行板ではC=εS/d。","板の面積Sと誘電率εが同じなら、距離dが2倍になるとCは半分です。","εは板の間の物質で決まる値、Sは板の面積、dは板の間隔です。今回はd以外が同じです。"],"visual":"capacitor-after","formula":["C₁ = 8µF","C₂ = C₁ ÷ 2 = 4µF"]},{"title":"電荷Qは、そのまま残る","ask":"静電容量が半分なら、電荷も半分ですか？","tell":["今回は電源を外しているので、電荷は逃げず、Qは同じです。","µは100万分の1です。8µF=8×10⁻⁶Fと直して計算します。"],"visual":"capacitor-before","formula":["Q = C₁V₁","Q = 8×10⁻⁶ × 1000 = 0.008C = 8mC"]},{"title":"同じ電荷を、半分の容量に保つ","ask":"では、電圧はどうなりますか？","tell":["Q=CVをV=Q/Cと読み替えます。","Qが同じでCが半分なら、電圧Vは2倍になります。電源につないだままの問題とは条件が違います。"],"visual":"capacitor-after","formula":["V₂ = Q / C₂","V₂ = 0.008 / (4×10⁻⁶) = 2000V"]},{"title":"エネルギーは、公式に順番に入れる","ask":"8Jは、どうやって出しますか？","tell":["静電エネルギーはW=½CV²です。変更後の容量と電圧を使います。","単位をFに直し、電圧は2乗することを忘れないようにしましょう。"],"visual":"capacitor-energy","formula":["W₂ = ½ × C₂ × V₂²","W₂ = ½ × (4×10⁻⁶) × 2000²","W₂ = 8J"]},{"title":"電源を外したのに、なぜエネルギーが増える？","ask":"初めは4Jなのに、増えてよいのですか？","tell":["電極どうしは引き合っています。その力に逆らって板を離すため、外から仕事をしています。","この仕事が静電エネルギーの増加につながります。エネルギーが突然わいてきたわけではありません。"],"visual":"capacitor-energy","formula":["W₁ = ½ × (8×10⁻⁶) × 1000² = 4J","W₂ − W₁ = 8 − 4 = 4J"]},{"title":"最後に「条件→変化→答え」を一枚にまとめる","ask":"何を覚えて復習すればよいですか？","tell":["電源を外す→Q一定。距離2倍→C半分。Q一定でC半分→V2倍。","したがって容量4µF・エネルギー8Jで、公式正答は選択肢(2)です。"],"visual":"capacitor-energy","check":{"prompt":"電源を外して電荷を保持したまま、容量が半分になったら電圧は？","options":["半分になる","変わらない","2倍になる"],"correct":2,"why":"Q=CVより、Q一定ならVはCに反比例します。"}}]},"third-2026-upper-theory-2":{"scope":"点電荷の電位差を図と分数で理解","origin":"公式の令和8年度上期・第三種理論の問題と正答を照合した独自の図解です。ネット記事からの引用ではありません。図は理解用の模式図です。","panels":[{"title":"電位差は「2つの場所の電位の差」","ask":"A-B間の距離だけを比べればよいですか？","tell":["点電荷が作る電位は、電荷Pからの距離rに反比例します。","Aの電位とBの電位を別々に計算して、差を取ります。A-B間の距離だけでは決まりません。","kは真空中で決まる定数です。この問題ではkと電荷の大きさ|Q|がどの実験でも同じなので、比較では共通部分としてまとめます。"],"visual":"point-a","formula":["V(r) = kQ / r","|V_AB| = k|Q| × (1/r_A − 1/r_B)"]},{"title":"まず距離を書き込む","ask":"Bまでの距離は、どこから測りますか？","tell":["r_AはPからAまで、r_BはPからBまでです。","図ではP、A、Bがこの順に一直線上に並ぶので、r_B=(P-A)+(A-B)です。"],"visual":"point-a","formula":["(a) r_A=2m、r_B=2+1=3m"]},{"title":"(a)を計算する","ask":"共通のk|Q|は毎回必要ですか？","tell":["同じ点電荷で比べるので、k|Q|は共通です。比較する部分の数値だけ計算しましょう。","(a)は1/2−1/3=1/6です。"],"visual":"point-a","formula":["(a) 1/2 − 1/3 = 1/6 ≈ 0.167"]},{"title":"(b)を計算する","ask":"A-Bが2mだから、Bの距離は2mですか？","tell":["PからAが1m、AからBが2mなので、PからBは3mです。","1/1−1/3=2/3となります。"],"visual":"point-b","formula":["(b) r_A=1、r_B=3","1 − 1/3 = 2/3 ≈ 0.667"]},{"title":"(c)を計算する","ask":"0.5mの逆数は？","tell":["1÷0.5=2です。Bの距離は0.5+1=1.5mです。","1/0.5−1/1.5=2−2/3=4/3となります。"],"visual":"point-c","formula":["(c) r_A=0.5、r_B=1.5","2 − 2/3 = 4/3 ≈ 1.333"]},{"title":"(d)を計算する","ask":"同じ1.5mでも、(c)と同じですか？","tell":["Aの距離も合わせて確認します。(d)ではAが1mです。","1−2/3=1/3なので、(c)とは違います。"],"visual":"point-d","formula":["(d) r_A=1、r_B=1.5","1 − 2/3 = 1/3 ≈ 0.333"]},{"title":"小さい順に並べて答えを選ぶ","ask":"最大と最小を、どう見抜きますか？","tell":["比較した値は(a)1/6、(b)2/3、(c)4/3、(d)1/3です。","小さい順は(a)→(d)→(b)→(c)。最小(a)、最大(c)なので選択肢(4)です。"],"visual":"point-c","formula":["1/6 \u003c 1/3 \u003c 2/3 \u003c 4/3"],"check":{"prompt":"Bまでの距離r_Bは、何を使いますか？","options":["A-B間だけの距離","P-AとA-Bを足した距離","P-AからA-Bを引いた距離"],"correct":1,"why":"電位V=kQ/rのrは、点電荷Pからの距離です。"}}]}},"notes":{},"originals":[],"forecasts":[],"citations":[],"pdfs":{}};</script><script>(function(root){
'use strict';
const DAY=86400000, SUBJECTS=['theory','power','machine','law'];
function dayKey(time=Date.now()){const d=new Date(time);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fresh(){return {version:1,settings:{targetYear:2027,examDate:'',weekday:60,weekend:60,goal:70},history:[],reviews:{},mocks:[],minutes:{},notes:{},exposures:{},session:null}}
function validate(s){if(!s||s.version!==1||!s.settings||!Array.isArray(s.history)||!Array.isArray(s.mocks))throw Error('対応していない学習記録です');for(const n of ['weekday','weekend'])if(!Number.isFinite(s.settings[n])||s.settings[n]<10||s.settings[n]>600)throw Error('学習時間が不正です');if(![2027,2028].includes(s.settings.targetYear))throw Error('目標年度が不正です');if(!Number.isFinite(s.settings.goal)||s.settings.goal<50||s.settings.goal>100)throw Error('目標点が不正です');if(s.settings.examDate&&(!/^\d{4}-\d{2}-\d{2}$/.test(s.settings.examDate)||!Number.isFinite(new Date(s.settings.examDate+'T00:00:00').getTime())||!s.settings.examDate.startsWith(String(s.settings.targetYear))))throw Error('試験日が不正です');for(const k of ['reviews','minutes','notes','exposures'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('学習記録の形式が不正です');if(s.history.length>100000||s.mocks.length>10000)throw Error('記録件数が多すぎます');for(const h of s.history)if(!h||typeof h.qid!=='string'||typeof h.item!=='number'||typeof h.correct!=='boolean'||!SUBJECTS.includes(h.subject)||!Number.isFinite(h.at)||!Number.isFinite(h.points)||h.points<=0)throw Error('解答記録が不正です');for(const [k,r] of Object.entries(s.reviews))if(!r||!Number.isFinite(r.due)||!Number.isFinite(r.streak)||!Number.isFinite(r.interval)||typeof r.lastCorrect!=='boolean')throw Error('復習情報が不正です');for(const m of s.mocks)if(!m||!SUBJECTS.includes(m.subject)||!Number.isFinite(m.score)||!Number.isFinite(m.total)||m.total<=0||!Number.isFinite(m.at)||typeof m.fresh!=='boolean')throw Error('模試記録が不正です');for(const v of Object.values(s.minutes))if(!Number.isFinite(v)||v<0)throw Error('学習時間が不正です');for(const [k,v] of Object.entries(s.notes))if(typeof v!=='string'||v.length>100000)throw Error('メモの形式が不正です');for(const [k,v] of Object.entries(s.exposures))if(!Number.isFinite(v)||v<0)throw Error('閲覧記録が不正です');for(const m of s.mocks){if(!Array.isArray(m.results)||!m.results.every(r=>r&&typeof r.qid==='string'&&Number.isInteger(r.item)&&typeof r.correct==='boolean'&&typeof r.expected==='string'))throw Error('模試の明細が不正です');if(m.score<0||m.score>m.total)throw Error('模試の点数が不正です')}
if(s.session){const m=s.session;if(!SUBJECTS.includes(m.subject)||!Array.isArray(m.ids)||!m.ids.length||m.ids.some(id=>typeof id!=='string')||!m.answers||typeof m.answers!=='object'||Array.isArray(m.answers)||!m.flags||typeof m.flags!=='object'||!Number.isFinite(m.deadline)||!Number.isFinite(m.started)||!Number.isFinite(m.minutes)||m.minutes<1||m.minutes>180)throw Error('途中の模試記録が不正です')}
return s}
function record(state,q,item,answer,confidence,reason,now=Date.now(),mode='practice'){
 const correct=answer===item.answer, k=q.id+':'+item.number, prev=state.reviews[k];
 const certain=confidence==='sure';let streak=correct&&certain?(prev?.streak||0)+1:0;
 let interval=correct?(certain?[1,3,7,14,30,60][Math.min(streak-1,5)]:1):1;
 state.reviews[k]={qid:q.id,item:item.number,streak,interval,due:now+(correct?interval*DAY:Math.min(DAY,6*3600000)),lastCorrect:correct,confidence,updated:now};
 const h={qid:q.id,item:item.number,subject:q.subject,topic:q.topic,kind:q.kind,answer:answer||'',correct,points:item.points,confidence,reason:correct?'':reason||'未分類',at:now,mode};state.history.push(h);return h;
}
function latest(state){const m=new Map;for(const h of state.history)m.set(h.qid+':'+h.item,h);return [...m.values()]}
function subjectStats(state){const h=latest(state);return SUBJECTS.map(subject=>{const rows=h.filter(r=>r.subject===subject&&r.kind==='past');return {subject,count:rows.length,correct:rows.filter(r=>r.correct).length,percent:rows.length?Math.round(100*rows.filter(r=>r.correct).length/rows.length):null}})}
function dueQuestions(state,questions,now=Date.now()){return questions.filter(q=>Object.values(state.reviews).some(r=>r.qid===q.id&&r.due<=now)).sort((a,b)=>{const due=q=>Math.min(...Object.values(state.reviews).filter(r=>r.qid===q.id).map(r=>r.due));return due(a)-due(b)})}

<div class="grid2"><section class="card"><div class="section-head"><h2>今日の学習メニュー</h2>${badge('60分の基本プラン')}</div><div class="task"><div class="task-num">01</div><div><strong>前回の内容を思い出す</strong><p>15分 · ${due.length?'復習日になった問題から':'まだ記録がなければ、既習問題で確認'}</p></div><button class="icon-button" data-view="review" aria-label="復習へ">→</button></div><div class="task"><div class="task-num">02</div><div><strong>${esc(subjectLabel(recommended.q.subject))} · ${esc(recommended.q.topic)}</strong><p>30分 · ${esc(recommended.reason)}</p></div><button class="icon-button" data-action="recommended" aria-label="おすすめ問題へ">→</button></div><div class="task"><div class="task-num">03</div><div><strong>解説を読み、自分の言葉で説明する</strong><p>15分 · 原因・公式・次の復習日を確認</p></div><button class="icon-button" data-view="plan" aria-label="学習計画へ">→</button></div><p class="small muted">配分は学習の出発点です。実績と理解度を見て調整します。</p></section>

function library(){const qs=ALL.filter(q=>(selectedSubject==='all'||q.subject===selectedSubject)&&q.kind===selectedKind&&(selectedKind!=='past'||q.year===selectedYear&&(LEVEL!==3||q.paper===selectedPaper))&&(!search||(q.topic+q.text+subjectLabel(q.subject)).includes(search)));return header('科目別演習','問題冊子の図・数式を見ながら、解答群の記号を選びます。')+`<div class="toolbar"><label>科目<select id="subject-filter"><option value="all">すべての科目</option>${DB.subjects.map(s=>`<option value="${s.id}" ${s.id===selectedSubject?'selected':''}>${s.label}</option>`).join('')}</select></label><label>教材<select id="kind-filter"><option value="past" ${selectedKind==='past'?'selected':''}>過去問</option><option ${LEVEL===3?'hidden':''} value="forecast" ${selectedKind==='forecast'?'selected':''}>独自予想・応用演習</option><option ${LEVEL===3?'hidden':''} value="original" ${selectedKind==='original'?'selected':''}>独自作成・基礎演習</option></select></label>${selectedKind==='past'?`<label>年度<select id="year-filter">${[...new Set(DB.questions.map(q=>q.year))].sort((a,b)=>b-a).map(y=>`<option value="${y}" ${y===selectedYear?'selected':''}>${y}年度</option>`).join('')}</select></label>`:''}<label class="search">キーワード<input id="question-search" placeholder="例：変圧器、半導体、保安" value="${esc(search)}"></label></div>${LEVEL===3?paperSelector(false):''}${selectedKind!=='past'?'<div class="notice warn">独自問題は基礎・応用の理解を確認する練習です。予想演習も一種本番の難度への校正は未実施で、実際の出題を保証するものではありません。本番形式の演習は「本番模試」から利用できます。</div>':'<div class="notice">登録済みの過去問を年度・科目で絞り込めます。各問題に対応する正答表と配点に基づき採点します。教材と出典で取り込み状況を確認できます。</div>'}<div class="section-head"><h2>${qs.length} 大問</h2><span class="small muted">条件を選んで絞り込み</span></div><div class="question-list">${qs.length?qs.map(questionRow).join(''):'<div class="card empty">該当する問題がありません。</div>'}</div>`}
function questionRow(q){const hs=C.latest(state).filter(h=>h.qid===q.id),wrong=hs.filter(h=>!h.correct).length,due=Object.values(state.reviews).some(r=>r.qid===q.id&&r.due<=Date.now());return `<article class="card question-row"><div class="qindex">${q.number}</div><div class="body"><div class="row">${badge(subjectLabel(q.subject),'blue')}${q.kind==='past'?badge(q.year+'年度'+(LEVEL===3?' '+(q.term==='upper'?'上期':q.term==='lower'?'下期':'通年'):'')):badge(q.kind==='forecast'?'独自予想・応用':'独自・基礎')}${q.optional?badge('選択問題','orange'):''}${due?badge('復習日','orange'):''}</div><h3>${esc(q.topic)}</h3><p>${q.items.length}小問 / ${q.items.reduce((s,x)=>s+x.points,0)}${q.kind!=='original'?'点':'単位'} · ${hs.length?`最新：${hs.length-wrong}/${hs.length}正解`:'未挑戦'}</p></div><button data-open="${q.id}">解く →</button></article>`}
function startPractice(id){const q=qById(id);if(!q)return;practice={qid:id,answers:{},confidence:'unsure',reason:'知識・公式',graded:false,results:[],started:Date.now()};state.exposures[id]=(state.exposures[id]||0)+1;save();nav('practice')}
function answerForm(q,answers={},graded=false,results=[]){return q.items.map(item=>{const result=results.find(r=>r.item===item.number),value=answers[item.number]||'';return `<div class="answer-item"><label for="answer-${item.number}">${item.label?esc(item.label):'小問 ('+item.number+')'} <span class="small muted">${item.points}${q.kind!=='original'?'点':''}</span></label>${item.prompt?`<p class="prompt">${esc(item.prompt)}</p><div class="options">${Object.entries(item.choices).map(([k,v])=>`<label class="option-label"><input type="radio" name="answer-${item.number}" value="${k}" data-answer="${item.number}" ${k===value?'checked':''} ${graded?'disabled':''}>${k}　${esc(v)}</label>`).join('')}</div>`:`<select id="answer-${item.number}" data-answer="${item.number}" ${graded?'disabled':''}><option value="">記号を選択</option>${q.options.map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`}${graded?`<div class="answer-result ${result?.correct?'':'wrong'}">${result?.correct?'✓ 正解':'不正解'} · あなた：${esc(value||'未解答')} / 正答：${item.answer}${item.choices?'　'+esc(item.choices[item.answer]):''}</div>`:''}</div>`}).join('')}
function paper(q){if(q.kind==='past'&&!q.pages.length)return `<section class="card"><h2>${q.year}年度 ${esc(subjectLabel(q.subject))} 問${q.number}</h2><p>問題冊子の <strong>問${q.number}${q.officialPage?'（PDFの'+q.officialPage+'〜'+q.officialPageEnd+'ページ）':''}</strong> を開きます。別タブで問題を読み、この画面で解答記号を選んで採点してください。</p><p><a class="archive-paper-link" href="${esc(q.localFile||q.sourceUrl)}${q.officialPage?'#page='+q.officialPage:''}" target="_blank" rel="noopener noreferrer">公式の問題PDFを開く ↗</a></p><p class="small muted">出典：${q.year}年度 ${LEVEL===3?'第三種電気主任技術者試験':'第一種電気主任技術者一次試験'} ${esc(subjectLabel(q.subject))}。原本の表示・保存には通信が必要です。解答・配点は採点後に表示します。</p></section>`;return `<div class="card paper">${q.pages.length?`<div class="paper-caption">元の問題冊子 · 図・数式を保持 / 画像を押すと拡大</div>${q.pages.map((p,i)=>`<img src="${p.src}" alt="${esc(subjectLabel(q.subject))} 問${q.number} 問題冊子${p.number}ページ" data-zoom="${q.id}:${i}" ${i>0?'loading="lazy"':''}><div class="paper-caption">冊子 ${p.number}ページ</div>`).join('')}`:`<div style="padding:28px"><div class="eyebrow muted">ORIGINAL · ${q.kind==='forecast'?'APPLIED PRACTICE':'FOUNDATION'}</div><h2>${esc(q.topic)}</h2><p>${esc(q.text)}</p>${q.kind==='forecast'?'<div class="notice warn">独自作成の予想演習。一種本番の難度への校正は未実施です。</div>':''}<div class="notice">解答・解説は採点後に表示します。</div></div>`}</div>`}
function exercise(){const q=qById(practice.qid),graded=practice.graded,points=practice.results.reduce((n,h)=>n+(h.correct?h.points:0),0),total=q.items.reduce((n,i)=>n+i.points,0);return header(`${subjectLabel(q.subject)} · 問${q.number}`,q.topic,`<button data-action="close-practice">一覧に戻る</button>`)+`<div class="exercise"><div>${paper(q)}${graded?explanation(q):''}</div><aside class="card answer-card"><div class="row between"><h2>解答する</h2>${badge(q.kind==='past'?'過去問':q.kind==='forecast'?'独自予想・応用':'独自・基礎','blue')}</div><p class="small muted">${q.kind==='past'?'紙面の解答群と記号を照合してください。':'正しい選択肢を一つ選んでください。'}</p><div id="answer-form">${answerForm(q,practice.answers,graded,practice.results)}</div>${graded?`<div class="feedback"><strong>${points} / ${total}${q.kind!=='original'?'点':'問'} 正解${q.kind!=='original'?'相当':''}</strong><br><span class="small">次の復習：${new Date(Math.min(...q.items.map(i=>state.reviews[q.id+':'+i.number].due))).toLocaleString('ja-JP')}</span></div>${q.pages.length||DB.lessons?.[q.id]||q.kind!=='past'?'<button class="primary block" data-action="read-comic">会話と図で解説を読む ↓</button>':''}<button class="block" data-action="next-recommended">次のおすすめへ →</button><button class="block" data-action="retry">もう一度解く</button>`:`<div class="confidence"><label for="confidence">解答の自信</label><select id="confidence"><option value="unsure">迷った・自信がない</option><option value="sure">根拠を説明できる</option><option value="guess">推測で選んだ</option></select><label for="reason">間違えた場合の主な原因</label><select id="reason">${['知識・公式','式の立て方','計算・単位','文章の読み違い','時間不足','未分類'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="primary block" data-action="grade">解答を採点する</button><p class="small muted">採点後に正答と基礎解説を表示します。迷った正解も早めの復習に回します。</p>`}</aside></div>`}
function comicBlock(q){return StudyComic.render(q,DB,comicPositions[q.id]||0,comicModes[q.id]||'one',comicChecks)}

function explanation(q){if(q.kind==='past'&&!q.pages.length&&!DB.lessons?.[q.id])return `<section class="card explanation"><h3>正答を確認して復習する</h3><p>公式の正答・配点との照合結果を表示しています。この問題の小問別の詳しい解説・漫画解説は未整備です。</p><ol><li>問題文で与えられた条件と、求める量を整理します。</li><li>使った式・単位と、迷った箇所を確認します。</li><li>次回の復習で、根拠を説明しながら解き直します。</li></ol><p><a href="${esc(q.answerLocalFile||q.answerUrl)}" target="_blank" rel="noopener noreferrer">この年度の公式正答・配点を確認 ↗</a></p><label for="self-note">自分の考え方・疑問のメモ</label><textarea id="self-note" data-note="${q.id}">${esc(state.notes[q.id]||'')}</textarea></section>`;const note=q.kind==='past'?DB.notes[q.topic]:null,specific=DB.lessons?.[q.id];return `<section class="card explanation"><div class="row between"><h3>考え方を整理する</h3>${badge(specific?'小問別の詳しい説明':q.worked?'独自問題の解説':'分野の基礎説明')}</div>${comicBlock(q)}<details class="plain-notes"><summary>元の要点をまとめて確認する</summary><p>${esc(note?.intro||'問題文の条件を整理してから、使う公式と単位を確認しましょう。')}</p>${q.formula?`<div class="formula">${esc(q.formula)}</div>`:''}<ol>${(q.worked||note?.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${note?`<div class="notice warn"><strong>間違えやすい点</strong><br>${esc(note.pitfall)}</div>`:''}</details><div class="source">${esc(specific?'公式の問題冊子と正答表を参照した、小問別の独自解説です。ネット記事や公式解説からの引用ではありません。':q.worked?'この問題と解説はアプリ独自作成です。':'ここはアプリ独自の分野別基礎説明です。各小問を導く完全な解説や、ネットからの引用ではありません。')}<br>${q.kind==='past'?'正答・配点：この問題に対応する年度の正答表（教材と出典に収録）':''}</div>${citationCards(q)}<label for="self-note"><strong>自分の言葉で説明する</strong></label><p class="small muted">何を使って、どう考えたか。次に気をつけることを書きます。</p><textarea id="self-note" data-note="${q.id}" placeholder="例：同電位なら抵抗の両端の電圧が0なので、電流も0になる。">${esc(state.notes[q.id]||'')}</textarea><div id="ai-help-box"><h3>AIに考え方を相談する</h3><p class="ai-state">${aiChecking?'接続状態を確認中…':aiAvailable?'AIの接続設定があります。以下の内容と、この問題の文章・画像・正答を接続先へ送信します。':'AI未接続。会話の解説・基本の採点・復習管理はそのまま使えます。接続には同梱サーバーでの設定が必要です。'}</p><textarea id="ai-question" placeholder="例：なぜこの式を使うのですか。電験三種の基礎から説明してください。"></textarea><button id="ai-send" class="block" data-action="ask-ai" ${!aiAvailable?'disabled':''}>問題と質問を送って説明を受ける</button><div id="ai-output" aria-live="polite"></div></div></section>`}
