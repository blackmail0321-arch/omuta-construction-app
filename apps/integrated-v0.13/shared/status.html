<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>工事の提出状況</title><link rel="stylesheet" href="status.css"></head><body><main>
<header><h1>工事の提出状況</h1><p>閲覧専用 · この画面から工事データは変更できません。</p></header>
<p id="status-message" role="status" aria-live="polite"></p>
<form id="login"><h2>ログイン</h2><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">ログイン</button><p>スマホでは閲覧専用アカウントを使用してください。登録された利用者だけが、共有された工事を確認できます。</p></form>
<section id="dashboard" hidden><div class="toolbar"><button id="refresh">最新の状態に更新</button><button id="logout" class="secondary">ログアウト</button></div><label>確認する工事<select id="project"><option value="">工事を選択してください</option></select></label><p id="updated"></p><div id="counts" aria-label="提出状況の件数"></div><details class="display-options"><summary id="condition-label">対象月・表示条件を変更</summary><label>月次書類の対象月<input id="month" type="month" required></label><label>表示する状況<select id="filter"><option value="all">すべて</option><option>期限超過</option><option>7日以内</option><option>未提出</option><option>差戻し</option><option>未確認</option><option>要再確認</option><option>確認済み</option><option>対象外</option></select></label></details><div id="rows"></div></section>
</main><script src="shared-config.js"></script><script src="shared-client.js"></script><script src="status.js"></script></body></html>
